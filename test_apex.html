<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
  <div id="otTimelineChart"></div>
  <script>
    const otTimelineOptions = {
        series: [{ name: 'OT Cases', data: [1, 2, 3] }],
        chart: { type: 'area', height: 300, toolbar: { show: false } },
        xaxis: { categories: ['a', 'b', 'c'], tooltip: { enabled: false } },
        tooltip: { y: { formatter: function (val) { return val + " cases" } } }
      };
    const chart = new ApexCharts(document.querySelector("#otTimelineChart"), otTimelineOptions);
    chart.render();
  </script>
</body>
</html>
